<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 280" width="800" height="280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sacred blue landscape animated banner">
  <defs>
    <style>
      /* <![CDATA[ */
      .a{transform-box:fill-box;transform-origin:center}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
      @keyframes driftL{0%,100%{transform:translateX(-18px)}50%{transform:translateX(18px)}}
      @keyframes driftR{0%,100%{transform:translateX(16px)}50%{transform:translateX(-16px)}}
      @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.85}80%{opacity:.35}100%{transform:translateY(-70px);opacity:0}}
      @keyframes fall{0%{transform:translateY(-14px);opacity:0}10%{opacity:.85}90%{opacity:.5}100%{transform:translateY(150px);opacity:0}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}
      @keyframes halo{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:.85;transform:scale(1.06)}}
      @keyframes beam{0%,100%{opacity:.35}50%{opacity:.9}}
      @keyframes bird{0%{transform:translateX(860px)}100%{transform:translateX(-60px)}}
      @keyframes petal{0%{transform:translate(0,0) rotate(0deg);opacity:0}12%{opacity:.85}88%{opacity:.3}100%{transform:translate(-40px,90px) rotate(160deg);opacity:0}}
      @keyframes flare{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes sheen{0%{transform:translateX(-240px)}60%,100%{transform:translateX(820px)}}
      @keyframes tide{0%,100%{transform:translateX(0)}50%{transform:translateX(-40px)}}
      /* === Grand cycle: deep-sea twilight (28s) === */
      @keyframes dusk{0%,24%{opacity:0}40%,62%{opacity:1}80%,100%{opacity:0}}
      @keyframes duskDim{0%,24%{opacity:0}40%,62%{opacity:.75}80%,100%{opacity:0}}
      @keyframes duskGlow{0%,24%{opacity:.25}40%,62%{opacity:1}80%,100%{opacity:.25}}
      @keyframes moonUp{0%,28%{transform:translateY(40px);opacity:0}44%,58%{transform:translateY(0);opacity:1}74%,100%{transform:translateY(40px);opacity:0}}
      @keyframes moonGrow{0%,20%{transform:scale(.9)}50%{transform:scale(1.12)}80%,100%{transform:scale(.9)}}
      @keyframes rain{0%,30%{opacity:0}38%,66%{opacity:.5}76%,100%{opacity:0}}
      @keyframes moonShimmer{0%,100%{opacity:.25}50%{opacity:.9}}

      .tw1{animation:tw 4s ease-in-out infinite}
      .tw2{animation:tw 6s ease-in-out infinite;animation-delay:-2s}
      .cl1{animation:driftL 26s ease-in-out infinite}
      .cl2{animation:driftR 32s ease-in-out infinite}
      .sp1{animation:rise 6s linear infinite}
      .sp2{animation:rise 8s linear infinite;animation-delay:-3s}
      .sf1{animation:fall 5s linear infinite}
      .sf2{animation:fall 7s linear infinite;animation-delay:-2s}
      .gl{animation:pulse 3.5s ease-in-out infinite}
      .gl2{animation:pulse 3.5s ease-in-out infinite;animation-delay:-1.7s}
      .hl{animation:halo 6s ease-in-out infinite}
      .bm{animation:beam 5s ease-in-out infinite}
      .bd{animation:bird 22s linear infinite}
      .p1{animation:petal 9s linear infinite}
      .p2{animation:petal 11s linear infinite;animation-delay:-5s}
      .rd{animation:flare 4s ease-in-out infinite}
      .sh{animation:sheen 9s ease-in-out infinite}
      .td{animation:tide 12s ease-in-out infinite}
      .dk{animation:dusk 28s ease-in-out infinite}
      .dkD{animation:duskDim 28s ease-in-out infinite}
      .dkG{animation:duskGlow 28s ease-in-out infinite}
      .mn{animation:moonUp 28s ease-in-out infinite}
      .mg{animation:moonGrow 28s ease-in-out infinite}
      .rn{animation:rain 28s linear infinite}
      .rn2{animation:rain 22s linear infinite;animation-delay:-9s}
      .ms{animation:moonShimmer 6s ease-in-out infinite}
      /* ]]> */
    </style>

    <!-- Smooth multi-stop sky: ivory haze -> light blue -> sea blue -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf7ff"/>
      <stop offset=".16" stop-color="#cfeaff"/>
      <stop offset=".34" stop-color="#a9d8f8"/>
      <stop offset=".52" stop-color="#86c6ef"/>
      <stop offset=".70" stop-color="#62b0e4"/>
      <stop offset=".86" stop-color="#4a9ad6"/>
      <stop offset="1" stop-color="#3a8ac9"/>
    </linearGradient>
    <linearGradient id="duskSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020a1c"/>
      <stop offset=".45" stop-color="#05163a"/>
      <stop offset=".78" stop-color="#0a2a5c"/>
      <stop offset="1" stop-color="#123f78"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".28" stop-color="#e8f6ff" stop-opacity=".55"/>
      <stop offset=".62" stop-color="#bfe4ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#a9d8f8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore" cx=".42" cy=".38" r=".62">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f2fbff"/>
      <stop offset="1" stop-color="#cfeaff"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#d8eeff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#a9d8f8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a80c0"/>
      <stop offset="1" stop-color="#2f6fa8"/>
    </linearGradient>
    <linearGradient id="peak1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset=".18" stop-color="#c6e4fa"/>
      <stop offset=".42" stop-color="#9ac6ea"/>
      <stop offset=".72" stop-color="#6fa6d4"/>
      <stop offset="1" stop-color="#4f88bb"/>
    </linearGradient>
    <linearGradient id="peak2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb2dd"/>
      <stop offset=".35" stop-color="#5b93c6"/>
      <stop offset=".75" stop-color="#3f76ab"/>
      <stop offset="1" stop-color="#2c5d92"/>
    </linearGradient>
    <linearGradient id="peak3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c6aa6"/>
      <stop offset=".45" stop-color="#1e4f88"/>
      <stop offset="1" stop-color="#143a69"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fc4ec"/>
      <stop offset=".25" stop-color="#5aa8dc"/>
      <stop offset=".60" stop-color="#3b86c4"/>
      <stop offset="1" stop-color="#1e5385"/>
    </linearGradient>
    <linearGradient id="shore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset=".5" stop-color="#dcefff"/>
      <stop offset="1" stop-color="#bcdcf6"/>
    </linearGradient>
    <linearGradient id="torii" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0453f"/>
      <stop offset=".5" stop-color="#d23a36"/>
      <stop offset="1" stop-color="#a8282a"/>
    </linearGradient>
    <linearGradient id="toriiTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2742"/>
      <stop offset="1" stop-color="#0e1626"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#dff2ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#bfe4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff" stop-opacity="0"/>
      <stop offset="1" stop-color="#f7fbff" stop-opacity=".9"/>
    </linearGradient>

    <!-- Soft-layered shadow filters (used sparingly: 3 total) -->
    <filter id="softShift" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softSmall" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blurOnly" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <radialGradient id="vig" cx=".5" cy=".45" r=".75">
      <stop offset=".6" stop-color="#03204a" stop-opacity="0"/>
      <stop offset="1" stop-color="#03204a" stop-opacity=".28"/>
    </radialGradient>

    <g id="cloudShape" fill="#ffffff">
      <rect x="0" y="8" width="86" height="10" rx="5"/>
      <rect x="10" y="2" width="46" height="14" rx="7"/>
      <rect x="40" y="0" width="30" height="12" rx="6"/>
    </g>
    <g id="birdShape" fill="none" stroke="#1d3350" stroke-width="2" stroke-linecap="round">
      <path d="M0 6 Q5 0 10 6 Q15 0 20 6"/>
    </g>
    <g id="pineShape" fill="#1b4a63">
      <polygon points="0,-26 9,0 -9,0"/>
      <polygon points="0,-14 12,8 -12,8"/>
    </g>
  </defs>

  <!-- ===== SKY & LIGHT ===== -->
  <rect width="800" height="280" fill="url(#sky)"/>
  <rect x="0" y="0" width="800" height="280" fill="url(#duskSky)" class="dk"/>

  <!-- Stars (revealed at dusk) -->
  <g fill="#ffffff" class="dkD">
    <circle cx="60" cy="40" r="1.4" class="tw1"/><circle cx="140" cy="70" r="1" class="tw2"/>
    <circle cx="230" cy="30" r="1.2" class="tw1"/><circle cx="320" cy="55" r="1" class="tw2"/>
    <circle cx="420" cy="24" r="1.3" class="tw1"/><circle cx="520" cy="48" r="1" class="tw2"/>
    <circle cx="610" cy="32" r="1.2" class="tw1"/><circle cx="700" cy="66" r="1" class="tw2"/>
    <circle cx="760" cy="36" r="1.4" class="tw1"/><circle cx="95" cy="95" r="1" class="tw2"/>
    <circle cx="370" cy="86" r="1" class="tw1"/><circle cx="560" cy="92" r="1.2" class="tw2"/>
  </g>

  <!-- Sun -->
  <g class="mg" style="transform-box:view-box;transform-origin:660px 70px">
    <circle cx="660" cy="70" r="80" fill="url(#sunGlow)"/>
    <circle cx="660" cy="70" r="22" fill="url(#sunCore)"/>
  </g>
  <!-- Moon (rises during dusk cycle) -->
  <g class="mn">
    <circle cx="660" cy="70" r="62" fill="url(#moonGlow)" class="ms"/>
    <circle cx="660" cy="70" r="17" fill="#f4fbff"/>
    <circle cx="666" cy="65" r="13" fill="#dfeeff" opacity=".6"/>
  </g>

  <!-- Clouds -->
  <g class="cl1" opacity=".85"><use href="#cloudShape" x="60" y="40"/></g>
  <g class="cl2" opacity=".65"><use href="#cloudShape" x="330" y="26" transform="scale(1.2)"/></g>
  <g class="cl1" opacity=".5" style="animation-delay:-9s"><use href="#cloudShape" x="540" y="110"/></g>
  <g class="cl2" opacity=".7" style="animation-delay:-14s"><use href="#cloudShape" x="700" y="88" transform="scale(.9)"/></g>

  <!-- Birds -->
  <g class="bd"><use href="#birdShape" x="0" y="66"/>
    <use href="#birdShape" x="28" y="54" transform="scale(.8)" style="transform-box:view-box"/>
  </g>

  <!-- Divine light beam -->
  <g class="bm">
    <polygon points="390,0 470,0 520,200 340,200" fill="url(#beamGrad)"/>
    <polygon points="410,0 450,0 485,200 375,200" fill="url(#beamGrad)" opacity=".7"/>
  </g>

  <!-- ===== MOUNTAINS (back -> front, layered depth) ===== -->
  <g filter="url(#softShift)">
    <path d="M0 160 L90 108 L150 138 L230 96 L310 134 L400 88 L490 130 L570 100 L650 132 L730 104 L800 140 L800 220 L0 220 Z" fill="url(#peak1)" opacity=".75"/>
  </g>
  <g filter="url(#softShift)">
    <path d="M0 180 L70 146 L140 168 L220 130 L310 162 L400 120 L480 156 L560 128 L640 160 L720 134 L800 164 L800 230 L0 230 Z" fill="url(#peak2)"/>
    <!-- snow caps -->
    <path d="M220 130 L236 142 L228 144 L220 138 L212 144 L204 142 Z" fill="#f2fbff" opacity=".9"/>
    <path d="M400 120 L416 133 L408 135 L400 129 L392 135 L384 133 Z" fill="#f2fbff" opacity=".9"/>
    <path d="M560 128 L575 140 L567 142 L560 136 L552 142 L545 140 Z" fill="#f2fbff" opacity=".85"/>
    <path d="M720 134 L734 145 L726 147 L720 141 L712 147 L706 145 Z" fill="#f2fbff" opacity=".8"/>
  </g>
  <g filter="url(#softShift)">
    <path d="M0 204 L80 176 L160 196 L250 168 L330 192 L420 164 L500 190 L590 170 L670 194 L750 176 L800 190 L800 236 L0 236 Z" fill="url(#peak3)"/>
    <ellipse cx="400" cy="204" rx="300" ry="22" fill="#0a2a4e" opacity=".3" filter="url(#blurOnly)"/>
  </g>

  <!-- Pine silhouettes -->
  <g opacity=".55">
    <use href="#pineShape" x="46" y="206" transform="scale(.7)" style="transform-box:view-box"/>
    <use href="#pineShape" x="150" y="200" transform="scale(.9)" style="transform-box:view-box"/>
    <use href="#pineShape" x="320" y="196" transform="scale(.8)" style="transform-box:view-box"/>
    <use href="#pineShape" x="486" y="200" transform="scale(1)" style="transform-box:view-box"/>
    <use href="#pineShape" x="628" y="196" transform="scale(.85)" style="transform-box:view-box"/>
    <use href="#pineShape" x="748" y="200" transform="scale(.7)" style="transform-box:view-box"/>
  </g>

  <!-- ===== SEA ===== -->
  <rect x="0" y="226" width="800" height="54" fill="url(#water)"/>
  <g stroke="#eaf7ff" stroke-linecap="round" fill="none" opacity=".55">
    <path d="M-40 238 H80 M150 238 H240 M320 238 H400 M500 238 H590 M680 238 H800" stroke-width="1.4" class="td"/>
    <path d="M-20 248 H110 M190 248 H300 M380 248 H470 M560 248 H660 M760 248 H840" stroke-width="1.1" class="td" style="animation-delay:-4s"/>
    <path d="M-40 258 H60 M140 258 H260 M340 258 H440 M520 258 H620 M720 258 H820" stroke-width="1" class="td" style="animation-delay:-8s"/>
    <path d="M-30 268 H90 M170 268 H280 M360 268 H460 M540 268 H640 M740 268 H830" stroke-width="1.2" class="td" style="animation-delay:-2s"/>
  </g>
  <!-- sun/moon shimmer on water -->
  <g class="ms" stroke="#ffffff" fill="none" stroke-linecap="round" opacity=".5">
    <path d="M630 240 H690 M640 251 H700 M646 262 H706" stroke-width="1.6" class="rd"/>
  </g>
  <!-- Specular sheen sweep -->
  <rect x="0" y="226" width="220" height="54" fill="url(#sheenGrad)" class="sh" style="transform-box:view-box"/>

  <!-- Shore -->
  <path d="M0 274 Q120 266 240 274 T480 274 T720 274 T960 274 L960 282 L0 282 Z" fill="url(#shore)" opacity=".95"/>
  <rect x="0" y="272" width="800" height="3" fill="#ffffff" opacity=".55"/>
  <rect x="0" y="226" width="800" height="8" fill="url(#fadeGrad)" opacity=".5"/>

  <!-- Torii gates (perspective pair on water) -->
  <g filter="url(#softSmall)">
    <g transform="translate(196,150) scale(1.25)" fill="url(#torii)" opacity=".93">
      <rect x="-16" y="-6" width="52" height="5" rx="1" fill="url(#toriiTop)"/>
      <rect x="-12" y="0" width="44" height="5" rx="1"/>
      <rect x="-9" y="15" width="38" height="4"/>
      <rect x="-6" y="19" width="32" height="6" fill="url(#toriiTop)"/>
      <rect x="-5" y="5" width="5" height="64"/>
      <rect x="20" y="5" width="5" height="64"/>
      <rect x="-8" y="66" width="11" height="4" fill="url(#toriiTop)"/>
      <rect x="17" y="66" width="11" height="4" fill="url(#toriiTop)"/>
      <rect x="-16" y="-6" width="52" height="2" fill="#ffffff" opacity=".35"/>
    </g>
    <g transform="translate(574,150) scale(1.25)" fill="url(#torii)" opacity=".93">
      <rect x="-16" y="-6" width="52" height="5" rx="1" fill="url(#toriiTop)"/>
      <rect x="-12" y="0" width="44" height="5" rx="1"/>
      <rect x="-9" y="15" width="38" height="4"/>
      <rect x="-6" y="19" width="32" height="6" fill="url(#toriiTop)"/>
      <rect x="-5" y="5" width="5" height="64"/>
      <rect x="20" y="5" width="5" height="64"/>
      <rect x="-8" y="66" width="11" height="4" fill="url(#toriiTop)"/>
      <rect x="17" y="66" width="11" height="4" fill="url(#toriiTop)"/>
      <rect x="-16" y="-6" width="52" height="2" fill="#ffffff" opacity=".35"/>
    </g>
  </g>

  <!-- Water shadow beneath gates -->
  <ellipse cx="196" cy="241" rx="36" ry="5" fill="#0d3260" opacity=".18"/>
  <ellipse cx="574" cy="241" rx="36" ry="5" fill="#0d3260" opacity=".18"/>

  <!-- Divine orb / mana halo (centerpiece, above gates) -->
  <g transform="translate(400,118)">
    <g class="hl">
      <circle r="86" fill="url(#sunGlow)" opacity=".55"/>
      <circle r="46" fill="none" stroke="#ffffff" stroke-width="1.2" opacity=".55"/>
      <circle r="62" fill="none" stroke="#bfe4ff" stroke-width="1" opacity=".4"/>
    </g>
    <circle r="16" fill="url(#sunCore)" filter="url(#softSmall)"/>
    <circle r="16" fill="none" stroke="#ffffff" stroke-width="1.6" opacity=".9"/>
    <circle r="6" fill="#ffffff" class="rd"/>
  </g>

  <!-- Dusk tint (deep sea twilight) -->
  <rect width="800" height="280" fill="#0b2250" class="dkD"/>
  <g class="dkG">
    <circle cx="400" cy="118" r="140" fill="url(#moonGlow)"/>
  </g>

  <!-- Spirit particles -->
  <g fill="#e8f8ff">
    <circle cx="352" cy="214" r="2.2" class="sp1"/>
    <circle cx="386" cy="220" r="1.6" class="sp2"/>
    <circle cx="424" cy="212" r="2" class="sp1" style="animation-delay:-1.5s"/>
    <circle cx="452" cy="220" r="1.5" class="sp2"/>
    <circle cx="300" cy="220" r="1.4" class="sp1" style="animation-delay:-2.4s"/>
    <circle cx="500" cy="216" r="1.8" class="sp2" style="animation-delay:-4s"/>
  </g>

  <!-- Sakura petals -->
  <g fill="#ffd5e2">
    <ellipse cx="330" cy="120" rx="4" ry="2.2" class="p1"/>
    <ellipse cx="470" cy="104" rx="3.6" ry="2" class="p2"/>
    <ellipse cx="370" cy="90" rx="3.8" ry="2" class="p1" style="animation-delay:-3s"/>
    <ellipse cx="440" cy="130" rx="3.4" ry="2" class="p2" style="animation-delay:-8s"/>
  </g>

  <!-- Snow / drift (top, gentle) -->
  <g fill="#ffffff">
    <circle cx="40" cy="0" r="1.8" class="sf1"/>
    <circle cx="120" cy="0" r="1.4" class="sf2"/>
    <circle cx="205" cy="0" r="2" class="sf1" style="animation-delay:-1.6s"/>
    <circle cx="290" cy="0" r="1.5" class="sf2"/>
    <circle cx="360" cy="0" r="2.2" class="sf1" style="animation-delay:-2.9s"/>
    <circle cx="445" cy="0" r="1.4" class="sf2"/>
    <circle cx="530" cy="0" r="1.9" class="sf1" style="animation-delay:-3.4s"/>
    <circle cx="615" cy="0" r="1.5" class="sf2"/>
    <circle cx="695" cy="0" r="1.8" class="sf1" style="animation-delay:-1.1s"/>
    <circle cx="765" cy="0" r="1.4" class="sf2"/>
  </g>

  <!-- Rain during dusk -->
  <g stroke="#cfe8ff" stroke-width="1" stroke-linecap="round" class="rn" opacity=".5">
    <path d="M80 0 v14 M150 22 v14 M240 6 v14 M330 30 v14 M430 12 v14 M520 26 v14 M620 4 v14 M710 20 v14"/>
  </g>
  <g stroke="#cfe8ff" stroke-width="1" stroke-linecap="round" class="rn2" opacity=".4">
    <path d="M110 40 v14 M200 16 v14 M290 44 v14 M380 24 v14 M490 40 v14 M580 8 v14 M670 36 v14 M760 14 v14"/>
  </g>

  <!-- Edge vignette for depth -->
  <rect width="800" height="280" fill="url(#vig)"/>
</svg>
