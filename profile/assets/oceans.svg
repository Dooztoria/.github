<?xml version="1.0" encoding="UTF-8"?>
<svg fill="none" viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* <![CDATA[ */
      /* Jellyfish */
      @keyframes jFloat1 { 0%,100%{ transform:translate(0,0) } 25%{ transform:translate(6px,-12px) } 50%{ transform:translate(-4px,-20px) } 75%{ transform:translate(8px,-8px) } }
      @keyframes jFloat2 { 0%,100%{ transform:translate(0,0) } 25%{ transform:translate(-8px,-16px) } 50%{ transform:translate(4px,-24px) } 75%{ transform:translate(-6px,-10px) } }
      @keyframes jPulse  { 0%,100%{ transform:scaleX(1) scaleY(1) } 50%{ transform:scaleX(1.06) scaleY(.94) } }

      /* Fish */
      @keyframes swimL { 0%{ transform:translateX(860px) } 100%{ transform:translateX(-140px) } }
      @keyframes swimR { 0%{ transform:translateX(-140px) scaleX(-1) } 100%{ transform:translateX(860px) scaleX(-1) } }
      @keyframes bob   { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-5px) } }

      /* Particles */
      @keyframes pFloat { 0%{ transform:translateY(0); opacity:0 } 15%{ opacity:.7 } 85%{ opacity:.4 } 100%{ transform:translateY(-100px); opacity:0 } }
      @keyframes gPulse { 0%,100%{ opacity:.15 } 50%{ opacity:.7 } }

      /* Bubbles */
      @keyframes bUp { 0%{ transform:translateY(0); opacity:0 } 10%{ opacity:.4 } 90%{ opacity:.2 } 100%{ transform:translateY(-420px); opacity:0 } }

      /* Rays */
      @keyframes rShim { 0%,100%{ opacity:.03; transform:skewX(-18deg) } 50%{ opacity:.08; transform:skewX(-18deg) translateX(12px) } }

      /* Seaweed */
      @keyframes swayL { 0%,100%{ transform:rotate(0deg) } 50%{ transform:rotate(-5deg) } }
      @keyframes swayR { 0%,100%{ transform:rotate(0deg) } 50%{ transform:rotate(5deg) } }

      /* Whale */
      @keyframes whale { 0%{ transform:translateX(900px) } 100%{ transform:translateX(-300px) } }

      .jf1    { animation:jFloat1 8s ease-in-out infinite }
      .jf2    { animation:jFloat2 10s ease-in-out infinite }
      .jp     { animation:jPulse 3s ease-in-out infinite; transform-origin:center top }
      .fl     { animation:swimL 14s linear infinite }
      .fr     { animation:swimR 18s linear infinite }
      .fl2    { animation:swimL 22s linear infinite; animation-delay:-10s }
      .fr2    { animation:swimR 13s linear infinite; animation-delay:-5s }
      .fb     { animation:bob 3s ease-in-out infinite }
      .pf     { animation:pFloat 12s linear infinite }
      .gp     { animation:gPulse 4s ease-in-out infinite }
      .bu     { animation:bUp 8s linear infinite }
      .rs     { animation:rShim 7s ease-in-out infinite alternate }
      .wl     { animation:swayL 4s ease-in-out infinite; transform-origin:bottom center }
      .wr     { animation:swayR 5s ease-in-out infinite; transform-origin:bottom center }
      .wh     { animation:whale 40s linear infinite }
      /* ]]> */
    </style>
    <linearGradient id="og" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f3460"/><stop offset="30%" stop-color="#0a2647"/>
      <stop offset="60%" stop-color="#071e3d"/><stop offset="100%" stop-color="#040d21"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#og)"/>

  <!-- Light Rays -->
  <rect x="80" y="-20" width="55" height="420" fill="#fff" class="rs"/>
  <rect x="280" y="-20" width="90" height="420" fill="#fff" class="rs" style="animation-delay:2s"/>
  <rect x="520" y="-20" width="40" height="420" fill="#fff" class="rs" style="animation-delay:1s"/>
  <rect x="660" y="-20" width="70" height="420" fill="#fff" class="rs" style="animation-delay:3s"/>

  <!-- Whale Silhouette -->
  <g class="wh" opacity=".06">
    <ellipse cx="100" cy="155" rx="75" ry="22" fill="#fff"/>
    <path d="M175,155 Q195,138 205,150 Q195,165 175,155Z" fill="#fff"/>
    <ellipse cx="35" cy="150" rx="22" ry="16" fill="#fff"/>
  </g>

  <!-- Glow Dots -->
  <circle cx="55" cy="95" r="1.8" fill="#60efff" class="gp"/><circle cx="175" cy="155" r="1.3" fill="#ff6eb4" class="gp" style="animation-delay:1s"/>
  <circle cx="315" cy="75" r="1.8" fill="#00ff87" class="gp" style="animation-delay:2s"/><circle cx="475" cy="195" r="1.5" fill="#7b2ff7" class="gp" style="animation-delay:.5s"/>
  <circle cx="595" cy="125" r="2" fill="#60efff" class="gp" style="animation-delay:1.5s"/><circle cx="715" cy="175" r="1.3" fill="#ff6eb4" class="gp" style="animation-delay:3s"/>
  <circle cx="395" cy="235" r="1.5" fill="#00ff87" class="gp" style="animation-delay:2.5s"/><circle cx="145" cy="295" r="1.8" fill="#60efff" class="gp" style="animation-delay:3.5s"/>
  <circle cx="545" cy="325" r="1.3" fill="#7b2ff7" class="gp" style="animation-delay:1.2s"/>

  <!-- Jellyfish 1 — Pink, large -->
  <g class="jf1" transform="translate(180,80)">
    <circle cx="0" cy="-8" r="30" fill="#ff6eb4" opacity=".08"/>
    <g class="jp">
      <ellipse cx="0" cy="0" rx="20" ry="14" fill="#ff6eb4" opacity=".5"/>
      <ellipse cx="0" cy="-2" rx="14" ry="9" fill="#ff8ec7" opacity=".3"/>
      <ellipse cx="0" cy="-4" rx="7" ry="4" fill="#fff" opacity=".2"/>
    </g>
    <path d="M-10,12 Q-14,30 -6,48 Q-1,60 -8,72" stroke="#ff6eb4" stroke-width="1.3" fill="none" opacity=".35"/>
    <path d="M0,14 Q4,32 -2,50 Q-5,62 2,74" stroke="#ff6eb4" stroke-width="1.3" fill="none" opacity=".25"/>
    <path d="M10,12 Q14,28 8,44 Q4,56 10,66" stroke="#ff6eb4" stroke-width="1.3" fill="none" opacity=".35"/>
    <path d="M-5,13 Q-8,34 -2,50" stroke="#ff8ec7" stroke-width=".8" fill="none" opacity=".2"/>
    <path d="M5,13 Q8,34 2,50" stroke="#ff8ec7" stroke-width=".8" fill="none" opacity=".2"/>
  </g>

  <!-- Jellyfish 2 — Cyan -->
  <g class="jf2" transform="translate(580,55)" style="animation-delay:-3s">
    <circle cx="0" cy="-6" r="22" fill="#60efff" opacity=".06"/>
    <g class="jp" style="animation-delay:1s">
      <ellipse cx="0" cy="0" rx="14" ry="10" fill="#60efff" opacity=".4"/>
      <ellipse cx="0" cy="-2" rx="9" ry="6" fill="#8af0ff" opacity=".25"/>
      <ellipse cx="0" cy="-3" rx="4" ry="2.5" fill="#fff" opacity=".18"/>
    </g>
    <path d="M-8,9 Q-11,24 -5,38 Q-1,48 -7,56" stroke="#60efff" stroke-width="1" fill="none" opacity=".3"/>
    <path d="M0,10 Q3,25 -1,40 Q-3,50 2,58" stroke="#60efff" stroke-width="1" fill="none" opacity=".22"/>
    <path d="M8,9 Q11,22 6,36 Q3,46 8,54" stroke="#60efff" stroke-width="1" fill="none" opacity=".3"/>
  </g>

  <!-- Jellyfish 3 — Purple, small bg -->
  <g class="jf1" transform="translate(400,185)" opacity=".45" style="animation-delay:-5s">
    <circle cx="0" cy="-5" r="15" fill="#7b2ff7" opacity=".06"/>
    <g class="jp" style="animation-delay:2s">
      <ellipse cx="0" cy="0" rx="9" ry="7" fill="#7b2ff7" opacity=".4"/>
      <ellipse cx="0" cy="-1" rx="5" ry="3.5" fill="#a855f7" opacity=".22"/>
    </g>
    <path d="M-5,6 Q-7,17 -2,27" stroke="#7b2ff7" stroke-width=".8" fill="none" opacity=".3"/>
    <path d="M0,7 Q2,18 -1,28" stroke="#7b2ff7" stroke-width=".8" fill="none" opacity=".22"/>
    <path d="M5,6 Q7,16 3,25" stroke="#7b2ff7" stroke-width=".8" fill="none" opacity=".3"/>
  </g>

  <!-- Fish -->
  <g class="fl"><g class="fb"><g transform="translate(0,115)"><ellipse cx="18" cy="7" rx="13" ry="5" fill="#ff6eb4" opacity=".55"/><path d="M31,7 L38,2 L38,12Z" fill="#ff6eb4" opacity=".4"/><circle cx="10" cy="5" r="1.3" fill="#fff" opacity=".8"/></g></g></g>
  <g class="fr"><g class="fb" style="animation-delay:1s"><g transform="translate(0,215)"><ellipse cx="18" cy="7" rx="11" ry="4.5" fill="#60efff" opacity=".5"/><path d="M29,7 L35,3 L35,11Z" fill="#60efff" opacity=".35"/><circle cx="10" cy="5.5" r="1.1" fill="#fff" opacity=".8"/></g></g></g>
  <g class="fl2" opacity=".4"><g class="fb" style="animation-delay:.5s"><g transform="translate(0,275)"><ellipse cx="9" cy="3.5" rx="6" ry="2.5" fill="#00ff87" opacity=".5"/><ellipse cx="22" cy="7" rx="6" ry="2.5" fill="#00ff87" opacity=".45"/><ellipse cx="14" cy="10.5" rx="6" ry="2.5" fill="#00ff87" opacity=".48"/></g></g></g>
  <g class="fr2" opacity=".35"><g class="fb" style="animation-delay:2s"><g transform="translate(0,55)"><ellipse cx="7" cy="2.5" rx="4.5" ry="1.8" fill="#ff6eb4" opacity=".45"/><ellipse cx="18" cy="5" rx="4.5" ry="1.8" fill="#ff6eb4" opacity=".38"/></g></g></g>

  <!-- Bio Particles rising -->
  <circle cx="95" cy="300" r="1.8" fill="#60efff" class="pf" style="animation-delay:0s"/><circle cx="210" cy="260" r="1.3" fill="#ff6eb4" class="pf" style="animation-delay:3s"/>
  <circle cx="360" cy="320" r="2" fill="#00ff87" class="pf" style="animation-delay:1s"/><circle cx="510" cy="280" r="1.5" fill="#60efff" class="pf" style="animation-delay:5s"/>
  <circle cx="630" cy="310" r="1.8" fill="#7b2ff7" class="pf" style="animation-delay:2s"/><circle cx="740" cy="270" r="1.3" fill="#ff6eb4" class="pf" style="animation-delay:7s"/>

  <!-- Bubbles -->
  <circle cx="150" cy="400" r="2.5" fill="#fff" opacity=".12" class="bu"/><circle cx="320" cy="400" r="3.5" fill="#fff" opacity=".08" class="bu" style="animation-delay:2s; animation-duration:10s"/>
  <circle cx="510" cy="400" r="2" fill="#fff" opacity=".1" class="bu" style="animation-delay:1s; animation-duration:7s"/><circle cx="670" cy="400" r="3" fill="#fff" opacity=".07" class="bu" style="animation-delay:4s; animation-duration:9s"/>

  <!-- Coral / Seaweed -->
  <g transform="translate(45,340)">
    <path d="M0,60 Q-4,38 4,22 Q9,12 7,0" stroke="#0e4d6e" stroke-width="2.5" fill="none" class="wl"/>
    <path d="M14,60 Q18,32 10,14 Q7,4 13,-5" stroke="#0d3b5a" stroke-width="2" fill="none" class="wr" style="animation-delay:1s"/>
    <path d="M28,60 Q23,40 28,22 Q33,8 26,0" stroke="#0e4d6e" stroke-width="1.8" fill="none" class="wl" style="animation-delay:.5s"/>
    <circle cx="7" cy="0" r="2.5" fill="#ff6eb4" opacity=".15"/><circle cx="13" cy="-5" r="1.8" fill="#60efff" opacity=".1"/>
  </g>
  <g transform="translate(350,358)">
    <path d="M0,42 Q7,22 0,8 Q-4,0 4,-8" stroke="#0d3b5a" stroke-width="2.5" fill="none" class="wr" style="animation-delay:2s"/>
    <path d="M18,42 Q13,28 20,12 Q25,4 18,0" stroke="#0e4d6e" stroke-width="2" fill="none" class="wl" style="animation-delay:.8s"/>
    <circle cx="4" cy="-8" r="2" fill="#7b2ff7" opacity=".15"/>
  </g>
  <g transform="translate(680,348)">
    <path d="M0,52 Q-7,32 3,15 Q8,3 4,-4" stroke="#0e4d6e" stroke-width="2.5" fill="none" class="wr" style="animation-delay:1.5s"/>
    <path d="M18,52 Q22,28 16,10 Q10,0 18,-7" stroke="#0d3b5a" stroke-width="2" fill="none" class="wl" style="animation-delay:.3s"/>
    <circle cx="4" cy="-4" r="2.5" fill="#00ff87" opacity=".15"/><circle cx="18" cy="-7" r="1.8" fill="#ff6eb4" opacity=".1"/>
  </g>

  <!-- Sea Floor -->
  <path d="M0,380 Q100,370 200,375 Q300,385 400,378 Q500,370 600,380 Q700,375 800,370 L800,400 L0,400Z" fill="#020b1a"/>
  <path d="M0,390 Q100,385 200,388 Q300,395 400,390 Q500,383 600,392 Q700,388 800,385 L800,400 L0,400Z" fill="#010815"/>
</svg>
