<?xml version="1.0" encoding="UTF-8"?>
<svg fill="none" viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* <![CDATA[ */
      .px { shape-rendering: crispEdges; }

      @keyframes twinkle  { 0%,100%{ opacity:.15 } 50%{ opacity:.9 } }
      @keyframes snowF    { 0%{ transform:translateY(-20px); opacity:0 } 10%{ opacity:.8 } 90%{ opacity:.4 } 100%{ transform:translateY(420px); opacity:0 } }
      @keyframes snowD    { 0%{ transform:translateY(-15px) translateX(0); opacity:0 } 10%{ opacity:.6 } 100%{ transform:translateY(420px) translateX(16px); opacity:0 } }
      @keyframes craneL   { 0%{ transform:translateX(860px) } 100%{ transform:translateX(-120px) } }
      @keyframes craneR   { 0%{ transform:translateX(-100px) scaleX(-1) } 100%{ transform:translateX(860px) scaleX(-1) } }
      @keyframes glide    { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-6px) } }
      @keyframes moonP    { 0%,100%{ opacity:.08 } 50%{ opacity:.18 } }
      @keyframes cDrift   { 0%,100%{ transform:translateX(0) } 50%{ transform:translateX(20px) } }
      @keyframes cDriftB  { 0%,100%{ transform:translateX(0) } 50%{ transform:translateX(-16px) } }
      @keyframes shootS   { 0%{ transform:translate(0,0); opacity:0 } 5%{ opacity:1 } 14%{ transform:translate(-200px,48px); opacity:0 } 100%{ opacity:0 } }

      .tw  { animation:twinkle 4s ease-in-out infinite }
      .tws { animation:twinkle 6s ease-in-out infinite }
      .sf  { animation:snowF 6s linear infinite }
      .sd  { animation:snowDrift 8s linear infinite }
      .cL  { animation:craneL 22s linear infinite }
      .cR  { animation:craneR 30s linear infinite }
      .cG  { animation:glide 3s ease-in-out infinite }
      .mP  { animation:moonP 5s ease-in-out infinite }
      .cD  { animation:cDrift 25s ease-in-out infinite }
      .cDB { animation:cDriftB 30s ease-in-out infinite }
      .shS { animation:shootS 10s linear infinite }
      /* ]]> */
    </style>

    <!-- Pixel crane (red-crowned) -->
    <g id="crane" class="px">
      <!-- Body -->
      <rect x="8" y="8" width="16" height="4" fill="#e8e0d8"/>
      <rect x="12" y="4" width="8" height="4" fill="#e8e0d8"/>
      <!-- Wings -->
      <rect x="0" y="4" width="8" height="4" fill="#d0c8c0"/>
      <rect x="24" y="4" width="8" height="4" fill="#d0c8c0"/>
      <rect x="4" y="0" width="4" height="4" fill="#d0c8c0"/>
      <rect x="24" y="0" width="4" height="4" fill="#d0c8c0"/>
      <!-- Wing tips (black) -->
      <rect x="0" y="0" width="4" height="4" fill="#1a1a2a"/>
      <rect x="28" y="0" width="4" height="4" fill="#1a1a2a"/>
      <!-- Head -->
      <rect x="24" y="8" width="4" height="4" fill="#e8e0d8"/>
      <rect x="28" y="8" width="4" height="4" fill="#e8e0d8"/>
      <!-- Crown (red) -->
      <rect x="26" y="6" width="4" height="2" fill="#c0392b"/>
      <!-- Beak -->
      <rect x="32" y="10" width="4" height="2" fill="#5a6a40"/>
    </g>

    <!-- Pixel cloud -->
    <g id="cloud" class="px">
      <rect x="8"  y="0" width="24" height="4" fill="#c0c8d8"/>
      <rect x="4"  y="4" width="32" height="4" fill="#c0c8d8"/>
      <rect x="0"  y="8" width="40" height="4" fill="#d0d8e4"/>
    </g>
    <g id="cloudB" class="px">
      <rect x="8"  y="0" width="32" height="4" fill="#b8c0d0"/>
      <rect x="4"  y="4" width="40" height="4" fill="#c0c8d8"/>
      <rect x="0"  y="8" width="48" height="4" fill="#d0d8e4"/>
      <rect x="4"  y="12" width="40" height="4" fill="#d8e0ea"/>
    </g>
  </defs>

  <!-- === SKY GRADIENT (pixel-banded) === -->
  <rect y="0"   width="800" height="60"  fill="#080c1a" class="px"/>
  <rect y="60"  width="800" height="50"  fill="#0e1428" class="px"/>
  <rect y="110" width="800" height="50"  fill="#161e38" class="px"/>
  <rect y="160" width="800" height="45"  fill="#1e2848" class="px"/>
  <rect y="205" width="800" height="45"  fill="#283258" class="px"/>
  <rect y="250" width="800" height="40"  fill="#344068" class="px"/>
  <rect y="290" width="800" height="40"  fill="#425078" class="px"/>
  <rect y="330" width="800" height="35"  fill="#506088" class="px"/>
  <rect y="365" width="800" height="35"  fill="#607098" class="px"/>

  <!-- === PIXEL STARS === -->
  <rect x="48"  y="20"  width="4" height="4" fill="#fff" class="px tw"/>
  <rect x="120" y="38"  width="3" height="3" fill="#fff" class="px tw" style="animation-delay:1.2s"/>
  <rect x="210" y="14"  width="4" height="4" fill="#fff" class="px tws" style="animation-delay:.6s"/>
  <rect x="300" y="50"  width="3" height="3" fill="#fff" class="px tw" style="animation-delay:2s"/>
  <rect x="380" y="25"  width="4" height="4" fill="#fff" class="px tw" style="animation-delay:.8s"/>
  <rect x="460" y="44"  width="3" height="3" fill="#fff" class="px tws" style="animation-delay:3s"/>
  <rect x="530" y="18"  width="4" height="4" fill="#fff" class="px tw" style="animation-delay:1.5s"/>
  <rect x="620" y="55"  width="3" height="3" fill="#fff" class="px tw" style="animation-delay:2.5s"/>
  <rect x="700" y="30"  width="4" height="4" fill="#fff" class="px tws" style="animation-delay:.3s"/>
  <rect x="770" y="62"  width="3" height="3" fill="#fff" class="px tw" style="animation-delay:1.8s"/>
  <rect x="85"  y="80"  width="3" height="3" fill="#fff" class="px tws" style="animation-delay:3.5s"/>
  <rect x="175" y="95"  width="4" height="4" fill="#fff" class="px tw" style="animation-delay:1s"/>
  <rect x="420" y="85"  width="3" height="3" fill="#fff" class="px tw" style="animation-delay:2.8s"/>
  <rect x="580" y="100" width="3" height="3" fill="#fff" class="px tws" style="animation-delay:.5s"/>
  <rect x="680" y="75"  width="4" height="4" fill="#fff" class="px tw" style="animation-delay:2.2s"/>

  <!-- === PIXEL MOON === -->
  <g transform="translate(140, 40)" class="px">
    <rect x="12" y="0"  width="20" height="4" fill="#fffde8" opacity=".9"/>
    <rect x="8"  y="4"  width="28" height="4" fill="#fffde8" opacity=".9"/>
    <rect x="4"  y="8"  width="36" height="4" fill="#fffde8" opacity=".9"/>
    <rect x="4"  y="12" width="36" height="4" fill="#fff8d0" opacity=".85"/>
    <rect x="4"  y="16" width="36" height="4" fill="#fff8d0" opacity=".85"/>
    <rect x="4"  y="20" width="36" height="4" fill="#fffde8" opacity=".9"/>
    <rect x="8"  y="24" width="28" height="4" fill="#fffde8" opacity=".9"/>
    <rect x="12" y="28" width="20" height="4" fill="#fffde8" opacity=".9"/>
    <!-- Craters -->
    <rect x="14" y="10" width="4" height="4" fill="#e8dfc0" opacity=".4"/>
    <rect x="26" y="18" width="4" height="4" fill="#e8dfc0" opacity=".3"/>
    <rect x="18" y="22" width="4" height="4" fill="#e8dfc0" opacity=".25"/>
  </g>
  <!-- Moon glow -->
  <rect x="132" y="32" width="60" height="48" fill="#fffde8" opacity=".05" class="mP px"/>

  <!-- === SHOOTING STAR === -->
  <g class="shS" transform="translate(620, 25)">
    <rect x="0" y="0" width="4" height="4" fill="#fff" class="px"/>
    <rect x="4" y="-4" width="4" height="4" fill="#fff" opacity=".7" class="px"/>
    <rect x="8" y="-8" width="4" height="4" fill="#fff" opacity=".4" class="px"/>
    <rect x="12" y="-12" width="4" height="4" fill="#fff" opacity=".2" class="px"/>
  </g>

  <!-- === PIXEL CLOUDS === -->
  <g class="cD"><use href="#cloud" x="60" y="135" opacity=".18"/></g>
  <g class="cDB"><use href="#cloudB" x="520" y="120" opacity=".12"/></g>
  <g class="cD" style="animation-delay:-10s"><use href="#cloud" x="340" y="155" opacity=".1"/></g>

  <!-- === BACK MOUNTAINS (distant, dark) === -->
  <g class="px">
    <!-- Range 1 -->
    <rect x="0"   y="280" width="800" height="120" fill="#283050"/>
    <polygon points="0,280 40,248 80,264 140,228 200,252 260,220 340,248 400,216 480,244 540,212 620,240 680,218 740,236 800,224 800,280 0,280" fill="#1e2840"/>
    <!-- Snow highlights -->
    <rect x="258" y="220" width="8" height="4" fill="#c0c8d8" opacity=".4"/>
    <rect x="398" y="216" width="8" height="4" fill="#c0c8d8" opacity=".35"/>
    <rect x="538" y="212" width="8" height="4" fill="#c0c8d8" opacity=".4"/>
  </g>

  <!-- === MT. FUJI (pixel art, center) === -->
  <g transform="translate(340, 160)" class="px">
    <!-- Mountain body -->
    <rect x="48"  y="0"   width="24" height="8"  fill="#c8d0e0"/>
    <rect x="36"  y="8"   width="48" height="8"  fill="#a0a8c0"/>
    <rect x="28"  y="16"  width="64" height="8"  fill="#8890a8"/>
    <rect x="20"  y="24"  width="80" height="8"  fill="#707898"/>
    <rect x="12"  y="32"  width="96" height="8"  fill="#606888"/>
    <rect x="4"   y="40"  width="112" height="8" fill="#505878"/>
    <rect x="-4"  y="48"  width="128" height="8" fill="#445070"/>
    <rect x="-12" y="56"  width="144" height="12" fill="#3a4868"/>
    <rect x="-20" y="68"  width="160" height="12" fill="#324060"/>
    <rect x="-28" y="80"  width="176" height="40" fill="#2a3858"/>
    <!-- Snow cap -->
    <rect x="48"  y="0"   width="24" height="4"  fill="#ffffff" opacity=".95"/>
    <rect x="44"  y="4"   width="32" height="4"  fill="#ffffff" opacity=".9"/>
    <rect x="40"  y="8"   width="40" height="4"  fill="#f0f4fa" opacity=".7"/>
    <rect x="36"  y="12"  width="48" height="4"  fill="#e8ecf4" opacity=".5"/>
    <!-- Snow streaks -->
    <rect x="44"  y="16"  width="4"  height="8"  fill="#e0e4f0" opacity=".3"/>
    <rect x="68"  y="16"  width="4"  height="8"  fill="#e0e4f0" opacity=".25"/>
  </g>

  <!-- === FRONT MOUNTAINS === -->
  <g class="px">
    <polygon points="0,320 60,284 120,308 200,272 280,300 360,340 440,296 520,316 600,280 680,304 760,276 800,292 800,400 0,400" fill="#2a3555"/>
    <polygon points="0,340 80,300 160,328 260,292 350,324 450,308 540,328 620,296 720,316 800,304 800,400 0,400" fill="#344068"/>
    <!-- Snow caps -->
    <rect x="198" y="272" width="8" height="4" fill="#d0d8e4" opacity=".45"/>
    <rect x="598" y="280" width="8" height="4" fill="#d0d8e4" opacity=".4"/>
    <rect x="758" y="276" width="8" height="4" fill="#d0d8e4" opacity=".4"/>
  </g>

  <!-- === PIXEL PINE TREES on ridgeline === -->
  <g class="px" fill="#1a2840" opacity=".55">
    <!-- Tree template: stacked triangles -->
    <polygon points="52,340 60,316 68,340"/>  <polygon points="55,324 60,308 65,324"/>
    <polygon points="140,335 148,308 156,335"/><polygon points="143,318 148,302 153,318"/>
    <polygon points="700,332 708,306 716,332"/><polygon points="703,316 708,300 713,316"/>
    <polygon points="560,338 566,318 572,338"/><polygon points="562,325 566,312 570,325"/>
    <polygon points="240,345 247,325 254,345"/><polygon points="243,332 247,320 251,332"/>
    <polygon points="770,340 776,324 782,340"/>
  </g>

  <!-- === PIXEL CRANES === -->
  <g class="cL"><g class="cG"><use href="#crane" x="0" y="175"/></g></g>
  <g class="cR"><g class="cG" style="animation-delay:1.5s"><use href="#crane" x="0" y="200" transform="scale(.7)"/></g></g>

  <!-- === SNOW PARTICLES (pixel squares) === -->
  <g class="px" fill="#fff">
    <rect x="35"  width="4" height="4" class="sf" style="animation-delay:0s"/>
    <rect x="110" width="3" height="3" class="sf" style="animation-delay:.8s; animation-duration:7s"/>
    <rect x="195" width="4" height="4" class="sf" style="animation-delay:2.2s"/>
    <rect x="265" width="3" height="3" class="sf" style="animation-delay:1.5s; animation-duration:8s"/>
    <rect x="330" width="4" height="4" class="sf" style="animation-delay:3s; animation-duration:5.5s"/>
    <rect x="410" width="3" height="3" class="sf" style="animation-delay:.3s; animation-duration:7.5s"/>
    <rect x="475" width="4" height="4" class="sf" style="animation-delay:2s"/>
    <rect x="540" width="3" height="3" class="sf" style="animation-delay:4s; animation-duration:6.5s"/>
    <rect x="615" width="4" height="4" class="sf" style="animation-delay:1.2s"/>
    <rect x="685" width="3" height="3" class="sf" style="animation-delay:2.8s; animation-duration:8s"/>
    <rect x="750" width="4" height="4" class="sf" style="animation-delay:.5s; animation-duration:6s"/>
    <rect x="155" width="3" height="3" class="sf" style="animation-delay:3.5s; animation-duration:7s"/>
    <rect x="570" width="4" height="4" class="sf" style="animation-delay:1.8s; animation-duration:5s"/>
  </g>

  <!-- Bottom edge -->
  <rect x="0" y="396" width="800" height="4" fill="#1a2238" class="px"/>
</svg>
