<?xml version="1.0" encoding="UTF-8"?>
<svg fill="none" viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* Aurora Animations */
      @keyframes auroraShift1 {
        0%   { d: path("M0,80 Q200,20 400,90 Q600,160 800,60 L800,0 L0,0 Z"); opacity: 0.35; }
        50%  { d: path("M0,60 Q200,130 400,40 Q600,100 800,80 L800,0 L0,0 Z"); opacity: 0.55; }
        100% { d: path("M0,80 Q200,20 400,90 Q600,160 800,60 L800,0 L0,0 Z"); opacity: 0.35; }
      }
      @keyframes auroraShift2 {
        0%   { d: path("M0,100 Q150,50 350,120 Q550,60 800,100 L800,0 L0,0 Z"); opacity: 0.25; }
        50%  { d: path("M0,70 Q250,140 450,50 Q650,120 800,70 L800,0 L0,0 Z"); opacity: 0.45; }
        100% { d: path("M0,100 Q150,50 350,120 Q550,60 800,100 L800,0 L0,0 Z"); opacity: 0.25; }
      }
      @keyframes auroraShift3 {
        0%   { d: path("M0,120 Q200,60 400,130 Q600,40 800,110 L800,0 L0,0 Z"); opacity: 0.2; }
        50%  { d: path("M0,90 Q300,150 500,60 Q700,130 800,80 L800,0 L0,0 Z"); opacity: 0.35; }
        100% { d: path("M0,120 Q200,60 400,130 Q600,40 800,110 L800,0 L0,0 Z"); opacity: 0.2; }
      }

      /* Shooting Star */
      @keyframes shootStar1 {
        0%   { transform: translate(700px, 20px); opacity: 0; }
        5%   { opacity: 1; }
        15%  { transform: translate(400px, 80px); opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes shootStar2 {
        0%   { transform: translate(200px, 10px); opacity: 0; }
        5%   { opacity: 1; }
        18%  { transform: translate(50px, 90px); opacity: 0; }
        100% { opacity: 0; }
      }

      /* Star Twinkle */
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50%      { opacity: 1; transform: scale(1.4); }
      }
      @keyframes twinkleSlow {
        0%, 100% { opacity: 0.4; }
        50%      { opacity: 0.9; }
      }

      /* Cloud Float */
      @keyframes cloudDrift1 { 0% { transform: translateX(0); } 100% { transform: translateX(60px); } }
      @keyframes cloudDrift2 { 0% { transform: translateX(0); } 100% { transform: translateX(-40px); } }

      /* Bird Fly */
      @keyframes flyAcross {
        0%   { transform: translateX(850px) translateY(0); }
        50%  { transform: translateX(400px) translateY(-12px); }
        100% { transform: translateX(-100px) translateY(0); }
      }
      @keyframes flyAcross2 {
        0%   { transform: translateX(-80px) scaleX(-1) translateY(0); }
        50%  { transform: translateX(400px) scaleX(-1) translateY(-8px); }
        100% { transform: translateX(860px) scaleX(-1) translateY(0); }
      }
      @keyframes wingFlap {
        0%, 100% { d: path("M0,6 Q8,-2 16,6 Q24,-2 32,6"); }
        50%      { d: path("M0,6 Q8,12 16,6 Q24,12 32,6"); }
      }

      /* Sun Pulse */
      @keyframes sunGlow {
        0%, 100% { r: 100; opacity: 0.15; }
        50%      { r: 130; opacity: 0.25; }
      }
      @keyframes sunRayRotate {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Mountain Parallax subtle */
      @keyframes mountainBreath {
        0%, 100% { opacity: 0.6; }
        50%      { opacity: 0.75; }
      }

      .aurora1 { animation: auroraShift1 8s ease-in-out infinite; }
      .aurora2 { animation: auroraShift2 10s ease-in-out infinite; }
      .aurora3 { animation: auroraShift3 12s ease-in-out infinite; }

      .star { animation: twinkle 3s ease-in-out infinite; transform-origin: center; }
      .star-slow { animation: twinkleSlow 5s ease-in-out infinite; }

      .shoot1 { animation: shootStar1 8s linear infinite; }
      .shoot2 { animation: shootStar2 12s linear infinite; animation-delay: 4s; }

      .cloud1 { animation: cloudDrift1 20s ease-in-out infinite alternate; }
      .cloud2 { animation: cloudDrift2 25s ease-in-out infinite alternate; }

      .bird1 { animation: flyAcross 16s linear infinite; }
      .bird2 { animation: flyAcross2 22s linear infinite; }
      .wing { animation: wingFlap 0.6s ease-in-out infinite; stroke-linecap: round; }

      .sun-outer { animation: sunGlow 6s ease-in-out infinite; }
      .sun-rays { animation: sunRayRotate 60s linear infinite; transform-origin: 680px 60px; }
    </style>

    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="25%" stop-color="#1a1040"/>
      <stop offset="50%" stop-color="#2d1b69"/>
      <stop offset="70%" stop-color="#1e3a5f"/>
      <stop offset="85%" stop-color="#2980b9"/>
      <stop offset="100%" stop-color="#6dd5fa"/>
    </linearGradient>

    <linearGradient id="auroraGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff87" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00ff87"/>
      <stop offset="50%" stop-color="#60efff"/>
      <stop offset="70%" stop-color="#ff6eb4"/>
      <stop offset="100%" stop-color="#ff6eb4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0"/>
      <stop offset="25%" stop-color="#7b2ff7"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="75%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#00ff87" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6eb4" stop-opacity="0"/>
      <stop offset="40%" stop-color="#c850c0"/>
      <stop offset="60%" stop-color="#4158d0"/>
      <stop offset="100%" stop-color="#4158d0" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7e6"/>
      <stop offset="40%" stop-color="#ffcc02"/>
      <stop offset="100%" stop-color="#ff8c00" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mountainGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="mountainGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162040"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>

    <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6dd5fa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f3460" stop-opacity="1"/>
    </linearGradient>

    <filter id="starBlur">
      <feGaussianBlur stdDeviation="1" />
    </filter>
    <filter id="auroraBlur">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <filter id="shootBlur">
      <feGaussianBlur stdDeviation="2" />
    </filter>
    <filter id="sunBlur">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="400" fill="url(#skyGrad)" />

  <!-- Stars Layer -->
  <circle cx="45"  cy="25"  r="1.2" fill="#fff" class="star" style="animation-delay:0s"/>
  <circle cx="120" cy="40"  r="0.8" fill="#fff" class="star" style="animation-delay:1.2s"/>
  <circle cx="200" cy="15"  r="1"   fill="#fff" class="star" style="animation-delay:0.5s"/>
  <circle cx="310" cy="55"  r="1.3" fill="#fff" class="star" style="animation-delay:2s"/>
  <circle cx="380" cy="20"  r="0.7" fill="#fff" class="star" style="animation-delay:0.8s"/>
  <circle cx="470" cy="35"  r="1.1" fill="#fff" class="star" style="animation-delay:1.5s"/>
  <circle cx="520" cy="70"  r="0.9" fill="#fff" class="star-slow" style="animation-delay:0s"/>
  <circle cx="590" cy="18"  r="1.4" fill="#fff" class="star" style="animation-delay:2.5s"/>
  <circle cx="650" cy="50"  r="0.6" fill="#fff" class="star" style="animation-delay:0.3s"/>
  <circle cx="720" cy="30"  r="1"   fill="#fff" class="star-slow" style="animation-delay:1s"/>
  <circle cx="80"  cy="80"  r="0.8" fill="#fff" class="star-slow" style="animation-delay:3s"/>
  <circle cx="160" cy="95"  r="1.2" fill="#fff" class="star" style="animation-delay:1.8s"/>
  <circle cx="260" cy="110" r="0.7" fill="#fff" class="star" style="animation-delay:0.7s"/>
  <circle cx="440" cy="90"  r="1"   fill="#fff" class="star-slow" style="animation-delay:2.2s"/>
  <circle cx="550" cy="105" r="0.9" fill="#fff" class="star" style="animation-delay:1.1s"/>
  <circle cx="760" cy="85"  r="1.1" fill="#fff" class="star" style="animation-delay:0.4s"/>
  <circle cx="35"  cy="130" r="0.6" fill="#fff" class="star-slow" style="animation-delay:2.8s"/>
  <circle cx="350" cy="140" r="0.8" fill="#fff" class="star" style="animation-delay:1.6s"/>

  <!-- Star glow layer -->
  <circle cx="200" cy="15"  r="3" fill="#fff" opacity="0.15" filter="url(#starBlur)" class="star" style="animation-delay:0.5s"/>
  <circle cx="590" cy="18"  r="4" fill="#fff" opacity="0.12" filter="url(#starBlur)" class="star" style="animation-delay:2.5s"/>
  <circle cx="310" cy="55"  r="3" fill="#fff" opacity="0.1"  filter="url(#starBlur)" class="star" style="animation-delay:2s"/>

  <!-- Aurora Borealis -->
  <path d="M0,80 Q200,20 400,90 Q600,160 800,60 L800,0 L0,0 Z" fill="url(#auroraGrad1)" filter="url(#auroraBlur)" class="aurora1"/>
  <path d="M0,100 Q150,50 350,120 Q550,60 800,100 L800,0 L0,0 Z" fill="url(#auroraGrad2)" filter="url(#auroraBlur)" class="aurora2"/>
  <path d="M0,120 Q200,60 400,130 Q600,40 800,110 L800,0 L0,0 Z" fill="url(#auroraGrad3)" filter="url(#auroraBlur)" class="aurora3"/>

  <!-- Shooting Stars -->
  <g class="shoot1">
    <line x1="0" y1="0" x2="40" y2="-15" stroke="url(#auroraGrad1)" stroke-width="2" stroke-linecap="round" filter="url(#shootBlur)"/>
    <circle cx="0" cy="0" r="2" fill="#fff"/>
  </g>
  <g class="shoot2">
    <line x1="0" y1="0" x2="35" y2="-20" stroke="#60efff" stroke-width="1.5" stroke-linecap="round" filter="url(#shootBlur)"/>
    <circle cx="0" cy="0" r="1.5" fill="#fff"/>
  </g>

  <!-- Sun (half-risen on right) -->
  <circle cx="680" cy="260" r="100" fill="#ffcc02" opacity="0.08" filter="url(#sunBlur)" class="sun-outer"/>
  <circle cx="680" cy="260" r="50" fill="url(#sunGrad)" opacity="0.6"/>
  <g class="sun-rays" opacity="0.15">
    <line x1="680" y1="200" x2="680" y2="180" stroke="#ffcc02" stroke-width="2"/>
    <line x1="722" y1="218" x2="732" y2="208" stroke="#ffcc02" stroke-width="2"/>
    <line x1="740" y1="260" x2="760" y2="260" stroke="#ffcc02" stroke-width="2"/>
    <line x1="638" y1="218" x2="628" y2="208" stroke="#ffcc02" stroke-width="2"/>
    <line x1="620" y1="260" x2="600" y2="260" stroke="#ffcc02" stroke-width="2"/>
    <line x1="710" y1="230" x2="725" y2="220" stroke="#ffcc02" stroke-width="1.5"/>
    <line x1="650" y1="230" x2="635" y2="220" stroke="#ffcc02" stroke-width="1.5"/>
  </g>

  <!-- Distant Mountains (back layer) -->
  <path d="M0,320 L60,260 L140,290 L220,240 L320,280 L400,230 L480,270 L560,225 L640,265 L720,235 L800,260 L800,400 L0,400 Z" 
        fill="url(#mountainGrad2)" opacity="0.5" style="animation: mountainBreath 10s ease-in-out infinite;"/>

  <!-- Mountains (front layer) -->
  <path d="M0,340 L80,285 L160,320 L260,270 L350,310 L440,260 L530,300 L620,255 L700,290 L780,265 L800,280 L800,400 L0,400 Z" 
        fill="url(#mountainGrad1)" opacity="0.7"/>
  
  <!-- Snow caps -->
  <path d="M260,270 L275,280 L245,280 Z" fill="#fff" opacity="0.3"/>
  <path d="M440,260 L455,272 L425,272 Z" fill="#fff" opacity="0.25"/>
  <path d="M620,255 L633,266 L607,266 Z" fill="#fff" opacity="0.3"/>

  <!-- Clouds -->
  <g class="cloud1" opacity="0.12">
    <ellipse cx="150" cy="170" rx="60" ry="15" fill="#fff"/>
    <ellipse cx="170" cy="163" rx="40" ry="12" fill="#fff"/>
    <ellipse cx="130" cy="167" rx="30" ry="10" fill="#fff"/>
  </g>
  <g class="cloud2" opacity="0.08">
    <ellipse cx="550" cy="150" rx="70" ry="12" fill="#fff"/>
    <ellipse cx="575" cy="143" rx="45" ry="10" fill="#fff"/>
    <ellipse cx="530" cy="146" rx="35" ry="9" fill="#fff"/>
  </g>
  <g class="cloud1" opacity="0.06" style="animation-delay: -8s">
    <ellipse cx="380" cy="195" rx="50" ry="10" fill="#fff"/>
    <ellipse cx="395" cy="189" rx="35" ry="8" fill="#fff"/>
  </g>

  <!-- Birds -->
  <g class="bird1">
    <path d="M0,6 Q8,-2 16,6 Q24,-2 32,6" stroke="#1a1040" stroke-width="2" fill="none" class="wing" transform="translate(0, 180)"/>
  </g>
  <g class="bird2">
    <path d="M0,6 Q8,-2 16,6 Q24,-2 32,6" stroke="#1a1040" stroke-width="1.5" fill="none" class="wing" transform="translate(0, 200) scale(0.7)"/>
  </g>

  <!-- Horizon Glow transition to ocean -->
  <rect x="0" y="360" width="800" height="40" fill="url(#horizonGlow)"/>

  <!-- Bottom edge: ocean surface line -->
  <rect x="0" y="395" width="800" height="5" fill="#0f3460"/>
</svg>
