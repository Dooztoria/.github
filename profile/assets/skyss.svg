<?xml version="1.0" encoding="UTF-8"?>
<svg fill="none" viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* <![CDATA[ */
      @keyframes twinkle     { 0%,100%{ opacity:.15 } 50%{ opacity:.9 } }
      @keyframes auroraPulse1{ 0%,100%{ opacity:.25; transform:translateX(0) } 50%{ opacity:.5; transform:translateX(15px) } }
      @keyframes auroraPulse2{ 0%,100%{ opacity:.15; transform:translateX(0) } 50%{ opacity:.35; transform:translateX(-12px) } }
      @keyframes auroraPulse3{ 0%,100%{ opacity:.1;  transform:translateX(0) } 50%{ opacity:.3; transform:translateX(10px) } }
      @keyframes shoot1{ 0%{ transform:translate(0,0); opacity:0 } 4%{ opacity:1 } 12%{ transform:translate(-250px,60px); opacity:0 } 100%{ opacity:0 } }
      @keyframes shoot2{ 0%{ transform:translate(0,0); opacity:0 } 5%{ opacity:.8 } 15%{ transform:translate(-200px,70px); opacity:0 } 100%{ opacity:0 } }
      @keyframes driftR { 0%,100%{ transform:translateX(0) } 50%{ transform:translateX(30px) } }
      @keyframes driftL { 0%,100%{ transform:translateX(0) } 50%{ transform:translateX(-25px) } }
      @keyframes flyL   { 0%{ transform:translateX(850px) } 100%{ transform:translateX(-120px) } }
      @keyframes flyR   { 0%{ transform:translateX(-120px) scaleX(-1) } 100%{ transform:translateX(850px) scaleX(-1) } }
      @keyframes glide  { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-8px) } }
      @keyframes sunP   { 0%,100%{ opacity:.5 } 50%{ opacity:.75 } }
      @keyframes rayS   { 0%,100%{ opacity:.04; transform:skewX(-15deg) } 50%{ opacity:.1; transform:skewX(-15deg) translateX(10px) } }

      .star     { animation:twinkle 4s ease-in-out infinite }
      .star-s   { animation:twinkle 6s ease-in-out infinite }
      .au1      { animation:auroraPulse1 10s ease-in-out infinite }
      .au2      { animation:auroraPulse2 13s ease-in-out infinite }
      .au3      { animation:auroraPulse3 16s ease-in-out infinite }
      .sh1      { animation:shoot1 9s linear infinite }
      .sh2      { animation:shoot2 13s linear infinite; animation-delay:5s }
      .cl-r     { animation:driftR 25s ease-in-out infinite }
      .cl-l     { animation:driftL 30s ease-in-out infinite }
      .b-l      { animation:flyL 18s linear infinite }
      .b-r      { animation:flyR 24s linear infinite }
      .b-bob    { animation:glide 3s ease-in-out infinite }
      .sg       { animation:sunP 6s ease-in-out infinite }
      .sr       { animation:rayS 7s ease-in-out infinite alternate }
      /* ]]> */
    </style>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#070b1a"/>
      <stop offset="20%"  stop-color="#0f1535"/>
      <stop offset="45%"  stop-color="#1a1050"/>
      <stop offset="65%"  stop-color="#1c2d5a"/>
      <stop offset="82%"  stop-color="#2980b9"/>
      <stop offset="100%" stop-color="#6dd5fa"/>
    </linearGradient>
    <linearGradient id="ag1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff87" stop-opacity="0"/><stop offset="30%" stop-color="#00ff87"/>
      <stop offset="55%" stop-color="#60efff"/><stop offset="75%" stop-color="#c850c0"/>
      <stop offset="100%" stop-color="#c850c0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ag2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0"/><stop offset="25%" stop-color="#7b2ff7"/>
      <stop offset="60%" stop-color="#00d2ff"/><stop offset="100%" stop-color="#00ff87" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ag3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6eb4" stop-opacity="0"/><stop offset="40%" stop-color="#c850c0"/>
      <stop offset="70%" stop-color="#4158d0"/><stop offset="100%" stop-color="#4158d0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a2a4a"/><stop offset="100%" stop-color="#0d1b2a"/></linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#14203a"/><stop offset="100%" stop-color="#0a1628"/></linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7e6"/><stop offset="40%" stop-color="#ffcc02" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#ff8c00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6dd5fa" stop-opacity=".2"/><stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <path id="bV" d="M0,4 Q6,-3 12,4 M12,4 Q18,-3 24,4" stroke="#1a1040" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </defs>

  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="40" cy="22" r="1" fill="#fff" class="star"/><circle cx="110" cy="45" r=".7" fill="#fff" class="star" style="animation-delay:1.5s"/>
  <circle cx="195" cy="18" r="1.2" fill="#fff" class="star-s" style="animation-delay:.6s"/><circle cx="270" cy="60" r=".8" fill="#fff" class="star" style="animation-delay:2.2s"/>
  <circle cx="340" cy="30" r="1" fill="#fff" class="star-s" style="animation-delay:.9s"/><circle cx="420" cy="50" r=".6" fill="#fff" class="star" style="animation-delay:3s"/>
  <circle cx="495" cy="25" r="1.1" fill="#fff" class="star" style="animation-delay:1.8s"/><circle cx="570" cy="65" r=".9" fill="#fff" class="star-s" style="animation-delay:.3s"/>
  <circle cx="630" cy="15" r="1.3" fill="#fff" class="star" style="animation-delay:2.5s"/><circle cx="710" cy="40" r=".7" fill="#fff" class="star" style="animation-delay:1.1s"/>
  <circle cx="770" cy="70" r="1" fill="#fff" class="star-s" style="animation-delay:3.5s"/><circle cx="80" cy="90" r=".8" fill="#fff" class="star" style="animation-delay:.4s"/>
  <circle cx="160" cy="105" r="1.1" fill="#fff" class="star-s" style="animation-delay:2.8s"/><circle cx="310" cy="85" r=".6" fill="#fff" class="star" style="animation-delay:1.3s"/>
  <circle cx="450" cy="100" r=".9" fill="#fff" class="star" style="animation-delay:.7s"/><circle cx="580" cy="110" r=".7" fill="#fff" class="star-s" style="animation-delay:2s"/>
  <circle cx="690" cy="95" r="1" fill="#fff" class="star" style="animation-delay:3.2s"/><circle cx="240" cy="130" r=".8" fill="#fff" class="star-s" style="animation-delay:1.6s"/>

  <!-- Aurora -->
  <path d="M0,70 Q200,15 400,80 Q600,145 800,55 L800,0 L0,0Z" fill="url(#ag1)" class="au1"/>
  <path d="M0,95 Q180,45 380,110 Q580,50 800,90 L800,0 L0,0Z" fill="url(#ag2)" class="au2"/>
  <path d="M0,110 Q220,55 420,120 Q620,35 800,100 L800,0 L0,0Z" fill="url(#ag3)" class="au3"/>

  <!-- Shooting Stars -->
  <g class="sh1" transform="translate(650,30)"><line x1="0" y1="0" x2="30" y2="-10" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".8"/><circle r="1.5" fill="#fff"/></g>
  <g class="sh2" transform="translate(250,20)"><line x1="0" y1="0" x2="25" y2="-12" stroke="#60efff" stroke-width="1" stroke-linecap="round" opacity=".7"/><circle r="1" fill="#fff"/></g>

  <!-- Sun -->
  <circle cx="690" cy="265" r="60" fill="url(#sun)" opacity=".5" class="sg"/>
  <rect x="120" y="0" width="50" height="400" fill="#fff" class="sr"/><rect x="380" y="0" width="80" height="400" fill="#fff" class="sr" style="animation-delay:2s"/><rect x="600" y="0" width="40" height="400" fill="#fff" class="sr" style="animation-delay:1s"/>

  <!-- Mountains -->
  <path d="M0,315 L70,255 L150,290 L230,240 L330,275 L410,225 L490,265 L570,220 L650,260 L730,230 L800,255 L800,400 L0,400Z" fill="url(#m2)" opacity=".5"/>
  <path d="M0,335 L85,280 L170,315 L270,265 L360,305 L450,255 L540,295 L630,250 L710,285 L790,260 L800,275 L800,400 L0,400Z" fill="url(#m1)" opacity=".7"/>
  <path d="M270,265 L283,276 L257,276Z" fill="#fff" opacity=".25"/><path d="M450,255 L462,267 L438,267Z" fill="#fff" opacity=".2"/><path d="M630,250 L641,261 L619,261Z" fill="#fff" opacity=".25"/>

  <!-- Clouds -->
  <g class="cl-r" opacity=".1"><ellipse cx="160" cy="175" rx="55" ry="13" fill="#fff"/><ellipse cx="180" cy="168" rx="35" ry="10" fill="#fff"/></g>
  <g class="cl-l" opacity=".07"><ellipse cx="560" cy="155" rx="65" ry="11" fill="#fff"/><ellipse cx="585" cy="148" rx="40" ry="9" fill="#fff"/></g>

  <!-- Birds -->
  <g class="b-l"><g class="b-bob"><use href="#bV" y="185"/></g></g>
  <g class="b-r"><g class="b-bob" style="animation-delay:1s"><use href="#bV" y="210" transform="scale(.7)"/></g></g>

  <!-- Horizon -->
  <rect x="0" y="365" width="800" height="35" fill="url(#hf)"/>
  <rect x="0" y="396" width="800" height="4" fill="#0f3460"/>
</svg>
